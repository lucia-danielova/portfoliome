<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interaktívne portfólio | Lucia Danielová – Web Development, UI/UX Dizajn a digitálna tvorba.">
    <title>Lucia Danielová | Interaktívne Portfólio</title>

    <!-- Google Fonts: Montserrat & Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Plávajúca hlavička v ľavom hornom rohu -->
    <header class="site-header">
        <div class="header-top">
            <span class="header-badge">Portfólio</span>
            <span class="progress-pill" id="progress-counter" title="Počet preskúmaných kameňov">Objavené: 0 / 9</span>
            <button class="overview-trigger" id="open-overview-btn" type="button" aria-label="Otvoriť rýchly prehľad sekcií">
                ☰ Rýchly prehľad
            </button>
        </div>
        <h1>Lucia <span>Danielová</span></h1>
        <p>Klikni na kamene na ceste a spoznaj moju prácu</p>
    </header>

    <!-- Hlavná scéna 16:9 s pozadím podklad.jpg; kamene a svetlušky vloží JavaScript -->
    <main class="stage-wrapper">
        <div class="portfolio-stage" id="stage" role="region" aria-label="Interaktívna mapa portfólia">
            <div class="ambient-particles" id="particles-container" aria-hidden="true"></div>
        </div>
    </main>

    <!-- Rýchla navigácia pre mobilné zariadenia -->
    <section class="mobile-section" aria-label="Rýchla navigácia pre mobilné zariadenia">
        <h2 class="mobile-section-title">Sekcie portfólia</h2>
        <div class="mobile-grid" id="mobile-grid"></div>
    </section>

    <!-- Modálne okno s detailom kameňa -->
    <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
        <div class="modal-content" id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="close-modal" id="close-btn" type="button" aria-label="Zavrieť okno">&times;</button>

            <div class="modal-body">
                <span class="modal-subtitle" id="modal-subtitle">Sekcia</span>
                <h2 id="modal-title">Názov sekcie</h2>
                <div class="divider">✦</div>
                <p id="modal-description">Tu sa zobrazí podrobný popis sekcie.</p>

                <div id="modal-dynamic-extra" class="modal-dynamic-extra"></div>
                <div id="modal-tags" class="modal-tags"></div>
                <div id="modal-action" class="modal-action"></div>
            </div>

            <div class="modal-footer">
                <button class="nav-arrow-btn" id="prev-stone-btn" type="button" aria-label="Predchádzajúca sekcia">
                    ← Predchádzajúci
                </button>
                <span class="modal-step-indicator" id="modal-step">1 / 9</span>
                <button class="nav-arrow-btn" id="next-stone-btn" type="button" aria-label="Nasledujúca sekcia">
                    Ďalší →
                </button>
            </div>
        </div>
    </div>

    <!-- Modálne okno s rýchlym prehľadom všetkých sekcií -->
    <div id="overview-overlay" class="modal-overlay" aria-hidden="true">
        <div class="modal-content overview-modal" role="dialog" aria-modal="true" aria-labelledby="overview-title">
            <button class="close-modal" id="close-overview-btn" type="button" aria-label="Zavrieť prehľad">&times;</button>
            <div class="modal-body">
                <span class="modal-subtitle">Kompletná mapa</span>
                <h2 id="overview-title">Rýchly prehľad portfólia</h2>
                <div class="divider">✦</div>
                <div class="overview-grid" id="overview-list"></div>
                <div class="overview-actions">
                    <button class="reset-progress-btn" id="reset-progress-btn" type="button">
                        ↺ Vynulovať postup objavovania
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast notifikácia -->
    <div id="toast-notification" class="toast-notification" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
